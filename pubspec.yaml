name: afaq_whatsapp
description: "آفاق واتساب — عميل WhatsApp كامل متصل بخادم FastAPI/neonize"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # الشبكة: REST + WebSocket + التخزين المحلي
  provider: ^6.1.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2

  # الوسائط: التقاط، ملفات، تسجيل صوتي، تشغيل فيديو وصوت
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  record: ^5.1.2
  video_player: ^2.9.1
  just_audio: ^0.10.0

  # عرض رمز QR بصيغة SVG القادمة من الخادم
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
